server:
  port: ${PORT:8080}

spring:
  application:
    name: ${SERVICE_NAME:payments-api}
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:5432/${DB_NAME:payments}
    username: ${DB_USER:cauri}
    password: ${DB_PASSWORD:cauri}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  flyway:
    enabled: true
    locations: classpath:db/migration
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP:localhost:9092}
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: ${KEYCLOAK_ISSUER:http://keycloak.platform.svc:8080/realms/cauri-staging}

keycloak:
  issuer: ${KEYCLOAK_ISSUER:http://keycloak.platform.svc:8080/realms/cauri-staging}
  client-id: ${KEYCLOAK_CLIENT_ID:payments-api}
  client-secret: ${KEYCLOAK_CLIENT_SECRET:changeme}

kafka:
  topic-prefix: ${KAFKA_TOPIC_PREFIX:staging.}

clients:
  ledger-core:
    base-url: ${LEDGER_CORE_URL:http://ledger-core:8080}
  fraud-scoring:
    base-url: ${FRAUD_SCORING_URL:http://fraud-scoring:8080}

management:
  endpoints:
    web:
      exposure:
        include: health,prometheus
  endpoint:
    health:
      probes:
        enabled: true
  prometheus:
    metrics:
      export:
        enabled: true

logging:
  level:
    root: ${LOG_LEVEL:INFO}
